---
# Router: Internet gateway + simulated multi-hop path (Mission 4 traceroute).

- name: Install packages
  apt:
    name:
      - python3-scapy
      - iproute2
      - iputils-ping
    state: present
    update_cache: yes
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Lab directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/lab, mode: "0755" }
    - { path: /opt/lab/secrets, mode: "0700" }

- name: Write the secret of this sandbox
  copy:
    content: "{{ flag_m4_trace }}\n"
    dest: /opt/lab/secrets/m4
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Forwarding and unthrottled ICMP errors (traceroute needs one error per probe)
  copy:
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.icmp_ratelimit = 0
    dest: /etc/sysctl.d/90-lab.conf
    mode: "0644"

- name: Apply sysctl settings
  command: sysctl --system
  changed_when: false

- name: Lab scripts
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: far_responder.py, dest: /opt/lab/far_responder.py, mode: "0750" }
    - { src: lab-far-net, dest: /usr/local/sbin/lab-far-net, mode: "0755" }

- name: systemd units
  copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - lab-far-net.service
    - lab-far-responder.service

- name: Enable and start the services
  systemd:
    name: "{{ item }}"
    daemon_reload: yes
    enabled: yes
    state: restarted
  loop:
    - lab-far-net
    - lab-far-responder
