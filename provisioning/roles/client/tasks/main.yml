---
- name: Install client traffic tools
  ansible.builtin.apt:
    name:
      - python3
      - python3-scapy
      - telnet
    state: present

- name: Create lab service directory
  ansible.builtin.file:
    path: /opt/netsec-lab
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install fixed-action traffic trigger service
  ansible.builtin.template:
    src: trigger-service.py.j2
    dest: /opt/netsec-lab/trigger-service.py
    owner: root
    group: root
    mode: '0700'

- name: Install trigger service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/netsec-trigger.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Network Security TP fixed traffic generator
      After=network.target
      [Service]
      Type=simple
      User=root
      ExecStart=/usr/bin/python3 /opt/netsec-lab/trigger-service.py
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target

- name: Enable fixed-action trigger service
  ansible.builtin.systemd:
    name: netsec-trigger
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure student SSH account is not configured
  ansible.builtin.user:
    name: student
    state: absent
    remove: true
