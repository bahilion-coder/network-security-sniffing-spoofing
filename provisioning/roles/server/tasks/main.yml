---
- name: Install target network services
  ansible.builtin.apt:
    name:
      - openssh-server
      - nginx
      - netcat-openbsd
    state: present

- name: Publish safe landing page without token URLs
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    mode: '0644'
    content: |
      <html><body><h1>Network Security TP target</h1>
      <p>Authorized isolated training environment.</p>
      <p>Mission tokens are not exposed through public HTTP endpoints.</p>
      </body></html>

- name: Enable target services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - ssh
    - nginx
