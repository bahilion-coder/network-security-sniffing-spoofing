# CyberRangeCZ Automatic Problem Generation variables.
# These values are generated per sandbox and injected into Ansible provisioning.
# Keep the variable names identical to answer_variable_name in training.json.
flag_m1_icmp:
  type: password
  length: 12
flag_m2_tcp:
  type: password
  length: 12
flag_m6_pcap:
  type: password
  length: 12
flag_m7_telnet:
  type: password
  length: 12

# Per-sandbox client SSH credential used only by root-owned traffic triggers.
client_ssh_password:
  type: password
  length: 20
