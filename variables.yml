# APG (variant answers): one value per sandbox, generated by the platform and injected into Ansible
# under the same name. training.json refers to them through "answer_variable_name".
# Same layout and variable type as the working seed-bof-lab.
# Every variable is consumed by provisioning (roles/*/tasks/main.yml) and is the raw value the
# student finds in the traffic of the mission. Values go to Ansible as file contents (never into a
# shell command or source code), so any character the generator produces is safe.
flag_m1_icmp:        # Mission 1  payload of the ICMP packets addressed to the attacker
  type: text
flag_m2_tcp:         # Mission 2  payload of the TCP stream to port 40444
  type: text
flag_m3_spoof:       # Mission 3  server's reply to an echo request with a forged outside source
  type: text
flag_m4_trace:       # Mission 4  echo reply of the far host (hop 4) of the traceroute
  type: text
flag_m5_sniffspoof:  # Mission 5  printed by lab-trigger m5 when the sniff-then-spoof program works
  type: text
flag_m6_pcap:        # Mission 6  payload of the UDP datagram to port 40445
  type: text
flag_m7_telnet:      # Mission 7  password of "labuser" in the Telnet login
  type: text
flag_m8_raw:         # Mission 8  server's reply to a correct raw-socket ICMP packet
  type: text
