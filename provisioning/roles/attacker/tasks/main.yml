---
# SEED Ubuntu 20.04 VM: the student machine.
- name: Add host aliases to /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
  loop:
    - { ip: 10.1.26.11, name: client }
    - { ip: 10.1.26.12, name: server }
    - { ip: 10.1.26.1, name: router }

# The SEED VM normally ships with most of these; installing is a no-op when they are present.
- name: Make sure the lab tools are installed
  apt:
    name:
      - python3-scapy
      - tcpdump
      - wireshark
      - traceroute
      - net-tools
      - iputils-ping
      - openssh-client
      - gcc
      - make
      - libpcap-dev
    state: present
    update_cache: yes
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Lab directories
  file:
    path: /opt/lab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Services used by the client (fake Telnet, TCP listeners)
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: lab-services.py, dest: /opt/lab/lab-services.py, mode: "0755" }
    - { src: lab-services.service, dest: /etc/systemd/system/lab-services.service, mode: "0644" }
    - { src: lab-route.service, dest: /etc/systemd/system/lab-route.service, mode: "0644" }

- name: Install lab helper commands
  copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - lab-iface
    - lab-trigger

- name: Create the lab directories of the student
  file:
    path: "{{ item }}"
    state: directory
    owner: seed
    group: seed
    mode: "0755"
  loop:
    - /home/seed/lab
    - /home/seed/.lab

- name: Starter code for the student
  copy:
    src: "starter/{{ item }}"
    dest: "/home/seed/lab/{{ item }}"
    owner: seed
    group: seed
    mode: "0644"
  loop:
    - sniffer.py
    - README.txt

# Key pair used by lab-trigger. The client only accepts it for the forced command "gen.py <id>":
# the student may read the private key (he is root on this machine) without gaining anything.
- name: Generate the trigger SSH key pair
  command: ssh-keygen -q -t ed25519 -N "" -C labtrigger -f /home/seed/.lab/id_ed25519
  args:
    creates: /home/seed/.lab/id_ed25519

- name: Fix ownership of the trigger key
  file:
    path: /home/seed/.lab/id_ed25519
    owner: seed
    group: seed
    mode: "0600"

- name: Read the public key
  slurp:
    src: /home/seed/.lab/id_ed25519.pub
  register: lab_trigger_pub

- name: Publish the public key for the client role (hostvars)
  set_fact:
    lab_trigger_pubkey: "{{ lab_trigger_pub.content | b64decode | trim }}"

- name: Enable and start the services
  systemd:
    name: "{{ item }}"
    daemon_reload: yes
    enabled: yes
    state: restarted
  loop:
    - lab-services
    - lab-route
