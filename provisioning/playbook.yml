---
# The attacker comes first: it generates the key that the client authorizes (lab-trigger).
- name: Configure attacker
  hosts: attacker
  become: true
  roles:
    - role: user-access
      user_access_username: seed
      user_access_password: dees
      user_access_sudo: True   # the student needs root for sniffing / spoofing; no secret lives here
    - role: chrony
    - role: attacker

- name: Configure client
  hosts: client
  become: true
  roles:
    - role: client

- name: Configure server
  hosts: server
  become: true
  roles:
    - role: server

- name: Configure router
  hosts: lab-router
  become: true
  roles:
    - role: router
