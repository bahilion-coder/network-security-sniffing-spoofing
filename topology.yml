name: network-security-sniffing-spoofing

hosts:
  - name: attacker
    base_box:
      # Confirm the exact image name and management username in OpenStack.
      image: seed-ubuntu-20.04
      mgmt_user: seed
    flavor: m1.medium

  - name: client
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.medium

  - name: server
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.medium

routers:
  - name: lab-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.medium

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: lab-switch
    cidr: 10.9.0.0/24
    accessible_by_user: true

net_mappings:
  - host: attacker
    network: lab-switch
    ip: 10.9.0.5
  - host: client
    network: lab-switch
    ip: 10.9.0.6
  - host: server
    network: lab-switch
    ip: 10.9.0.7

router_mappings:
  - router: lab-router
    network: lab-switch
    ip: 10.9.0.1

groups: []
